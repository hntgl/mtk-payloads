name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payloads:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build payloads (new build system)
        run: nix develop --command make -j"$(nproc)" all

      - name: Build payloads (legacy Makefiles)
        run: |
          nix develop --command bash -euo pipefail -c '
            for f in */Makefile; do
              dir=${f%/Makefile}
              if [ -f "$dir/payload.mk" ]; then
                continue
              fi
              echo "::group::build $dir"
              make -C "$dir" -j"$(nproc)"
              echo "::endgroup::"
            done
          '

      - name: Upload payloads
        uses: actions/upload-artifact@v4
        with:
          name: payloads-${{ github.sha }}
          path: payloads/
          if-no-files-found: error
          retention-days: 14
